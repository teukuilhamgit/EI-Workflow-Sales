<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EI Workflow Tracker</title>
<style>
:root{--bg:#f8f8f8;--card:#fff;--ink:#111;--mute:#6b6b6b;--line:#d9d9d9;--red:#e3001b;--grn:#1e8449;--hl:#fff3b0;--hlb:#e0b400}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Frutiger Next LT W1G","Frutiger Next","Frutiger","Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:300;background:var(--bg);color:var(--ink)}
b,.hl,.t{font-weight:700}
button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:0;padding:6px 14px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--ink)}
button.p{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.row{background:var(--card);border-top:1px solid var(--ink);padding:12px 4px;display:grid;grid-template-columns:1fr auto;gap:10px;cursor:pointer;align-items:center}
.row:hover{background:#fff;box-shadow:inset 3px 0 0 var(--red)}
.hl{background:var(--hl);border:1px solid var(--hlb);padding:2px 8px;margin-right:6px;display:inline-block}.hl i{font-style:normal;font-weight:300;font-size:11px;color:var(--mute);margin-right:5px}
.m{color:var(--mute);font-size:12.5px;white-space:pre-wrap;margin-top:5px}.tag{display:inline-block;font-size:12px;color:var(--red)}
h2{font-size:13px;margin:20px 0 8px;font-weight:700;border-top:1px solid var(--ink);padding-top:8px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input[type=text],.bar select{padding:6px 8px;border:1px solid var(--line);border-radius:0;background:#fff}
dialog{border:none;border-radius:0;padding:0;width:min(800px,94vw);max-height:92vh;background:#fff}dialog::backdrop{background:#0007}
.dh{padding:14px 22px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;color:var(--red);font-size:20px}.dh b{font-weight:300}
.db{padding:16px 22px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lb{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.w{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:0}.req .lb,.rq .lb{color:#7a5d00;font-weight:700}.req .lb:after,.rq .lb:after{content:" *";color:var(--red)}.req.opt .lb:after{content:""}
.req input,.rq input{background:var(--hl);border:2px solid var(--hlb);border-radius:0}.req input.bad,.rq input.bad{border-color:var(--red);background:#ffe3e3}
.nx{border:1px solid var(--ink);padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sl{margin:6px 0}.sl div{padding:3px 8px;cursor:pointer;display:flex;gap:8px}.sl div:hover{background:#f0f0f0}.sl .cur{background:var(--ink);color:#fff}.sl .ok{color:var(--grn)}.sl .sh{cursor:default;font-size:11px;text-transform:uppercase;color:var(--red);margin-top:8px;padding:0 8px;font-weight:700}
textarea.d{min-height:180px}textarea.n{min-height:110px}.hide{display:none}.log{font-size:12.5px;color:var(--mute);margin:6px 0}
.gp{border:1px solid var(--line);padding:10px;margin:8px 0}.gp .g{grid-template-columns:1fr 1fr}.gp .g>div{margin-bottom:2px}

.app{display:flex;min-height:100vh}
#side{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand b{font-size:20px;font-weight:700;letter-spacing:.5px}.brand i{color:var(--red);font-style:normal}.brand span{display:block;font-size:11px;color:var(--mute)}
.mh{font-size:11px;letter-spacing:.18em;color:var(--mute);margin:26px 8px 8px;font-weight:700}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;border-left:3px solid transparent;background:none;padding:11px 12px;font-size:15px;color:var(--mute);margin-bottom:4px}
.mi svg{flex:none}.mi.on{background:#fdecee;color:var(--red);border-left-color:var(--red);font-weight:700}.mi:hover{border-color:transparent;color:var(--ink)}.mi.on:hover{border-left-color:var(--red);color:var(--red)}
.mi em{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px solid var(--line);padding:0 5px}
.sf{margin-top:auto;padding-top:20px}.sf button{display:block;border:none;background:none;padding:3px 8px;font-size:12px;color:var(--mute)}.sf button:hover{color:var(--red)}.sf .fnote{font-size:10.5px;color:var(--mute);margin:8px 8px 0}
.mainwrap{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 28px;height:62px;background:#fff;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}.top b{color:var(--ink);font-weight:700}#date{font-size:13px}
main{padding:26px 28px 60px;max-width:1150px}
.eyebrow{font-size:11px;letter-spacing:.25em;color:var(--red);font-weight:700}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:12px}
.pt1{font-size:36px;font-weight:300;margin:0;line-height:1.15}.pt1 b{font-weight:700}.sub{color:var(--mute);margin:8px 0 0;font-size:15px}
button.big{padding:14px 22px;letter-spacing:.06em}
.rule{height:1px;background:var(--line);margin:18px 0 22px;position:relative}.rule:before{content:"";position:absolute;left:0;top:-1px;width:108px;height:3px;background:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-top:1px solid var(--ink);padding:14px 16px}.stat .ico{width:34px;height:34px;background:#fdecee;color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:10px}.stat .sl2{font-size:13px}.stat b{display:block;font-size:44px;font-weight:300;color:var(--red);line-height:1.1;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:5px 14px;font-size:13px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);padding:12px 14px;margin-bottom:12px}
main{padding:14px 20px 40px}.top{height:48px}
.phead2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ttl{font-size:20px;font-weight:300;color:var(--red);letter-spacing:.02em}
.tools{display:flex;gap:8px;align-items:center}.sm{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:0;background:#fff;font-family:inherit}button.sm.p{background:var(--red);color:#fff;border-color:var(--red);font-weight:700;padding:6px 12px;letter-spacing:.04em}label.sm{border:none;background:none;padding:0 4px}#q{width:220px}
.phead2+.rule{margin:10px 0 12px}
.sbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.sb{display:flex;align-items:baseline;gap:10px;padding:7px 14px;font-size:13px;border:1px solid var(--line);border-top:1px solid var(--ink);background:#fff;min-width:100px;justify-content:space-between}.sb b{font-size:20px;font-weight:300;color:var(--red);line-height:1}.sb.on{background:#fdecee;border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red);font-weight:700}.grow{flex:1}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}.col{background:#efefef;border-top:1px solid var(--ink);padding:6px}.ch{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red);padding:2px 4px 6px}.cb{max-height:calc(100vh - 175px);overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.note{display:block!important;padding:7px 8px!important;font-size:12px;border:1px solid var(--line);border-top:1px solid var(--ink);box-shadow:0 1px 2px #0001;background:#fff}.note .hl{font-size:11.5px;padding:0 5px;margin:0 4px 3px 0}.note .tag{font-size:10.5px}.note .m{font-size:11px;margin-top:3px}
.lst{display:block}.lst .row{padding:6px;font-size:12px}.lst .hl{font-size:11.5px;padding:0 5px}.lst .tag{font-size:11px}
@media(max-width:820px){.board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:86%;overflow-x:auto}#q{width:140px}.cb{max-height:none}.lst{grid-template-columns:1fr}}
.sb.tot{padding:11px 22px;font-size:15px;min-width:170px;border-top:2px solid var(--red)}.sb.tot b{font-size:34px}.vr{width:1px;align-self:stretch;background:var(--ink);margin:0 10px}
.note>.hl{display:block;width:fit-content;margin:0}.note .l2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}.note .l2 .hl{margin:0}.note .l2 .tag{font-size:12px}
#tg{border:none;background:none;font-size:20px;padding:4px 10px 4px 0;color:var(--ink);line-height:1}.tl2{display:flex;align-items:center;gap:6px}
.kh{font:600 10px ui-monospace,Consolas,monospace;border:1px solid var(--line);padding:0 5px;color:var(--mute);background:#fff;margin-left:6px;font-weight:600}button.p .kh{background:transparent;color:#fff;border-color:#fff9}
.mi span{flex:1}.mi em{margin-left:0}.brand s{text-decoration:none}
.sf{border-top:1px solid var(--line);padding:8px 2px 0;display:flex;flex-wrap:wrap;gap:0 4px;margin-top:auto}.sf button{display:inline-block;padding:3px 6px;font-size:11px}.sf .fnote{width:100%;font-size:10px;margin:4px 6px 0}
#ov{display:none}
.sb{align-items:center}.sb.tot,.sb.dn{min-height:54px}.sb.dn{padding:11px 22px;font-size:15px;min-width:130px;justify-content:center}
.ch{display:flex;align-items:center;gap:8px;cursor:pointer}.ch b{font-size:16px;font-weight:300;color:var(--ink);letter-spacing:0}.ch i{margin-left:auto;font-style:normal;font-size:16px}.ch:hover span{text-decoration:underline}
.lh{font-size:13px;font-weight:700;margin:2px 0 6px;color:var(--red)}
@media(min-width:821px){body.sc #side{width:60px;padding:20px 8px}body.sc .brand s,body.sc .brand span,body.sc .mh,body.sc .mi span,body.sc .mi em,body.sc .mi .kh,body.sc .sf{display:none}body.sc .mi{justify-content:center;padding:11px 0}}
@media(max-width:820px){
 .app{display:block}#side{position:fixed;left:0;top:0;bottom:0;height:100vh;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px #0003;padding:20px 14px}
 body.so #side{transform:none}body.so #ov{display:block;position:fixed;inset:0;background:#0006;z-index:20}
 .top{position:sticky;top:0;z-index:10;padding:0 12px}#date,.kh{display:none}main{padding:12px 12px 40px}
 .mi{padding:14px 12px}.phead2{gap:8px}.tools{width:100%}#q{flex:1;width:auto;min-width:0}button.sm.p{padding:10px 14px}.sm{padding:9px}
 .sbs{gap:8px}.sb.tot,.sb.dn{flex:1;min-width:0}.sbs .grow{display:none}.sbs select,.sbs label{flex:1 1 40%}
 .board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:86%;overflow-x:auto;scroll-snap-type:x mandatory}.col{scroll-snap-align:start}.cb{max-height:none}
 .row{padding:10px 8px}.note{padding:10px!important}.lst{display:block}
 dialog{width:100vw;max-width:100vw;height:100vh;max-height:100vh;margin:0;border-radius:0}input,select,textarea{font-size:16px}.gp .g,.g{grid-template-columns:1fr}.pt1{font-size:26px}
}
body{font-weight:400}
.cn{font-size:13.5px;font-weight:700;color:var(--ink)}.pic{display:inline-flex;align-items:center;gap:5px;color:var(--mute);font-size:12.5px}.stg{color:var(--mute);font-size:12.5px}
.note .nt1{display:flex;align-items:center;justify-content:space-between;gap:6px}.note .nt2{display:flex;align-items:center;gap:12px;margin-top:3px;flex-wrap:wrap}.note>.hl,.note .l2{display:none}
.row .rl{min-width:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.row .rr{display:flex;align-items:center;gap:10px}.lst .row{align-items:center}
.row.pri{box-shadow:inset 3px 0 0 var(--red)}.note.pri{box-shadow:0 1px 2px #0001,inset 3px 0 0 var(--red)}
.acts{display:inline-flex;align-items:center;gap:2px}.ib{border:none;background:none;color:#b5b5b5;font-size:16px;padding:2px 6px;line-height:1;border-radius:0}.ib.on{color:var(--red)}.ib:hover{color:var(--ink);border:none}
.tick{border:1px solid var(--line);border-radius:50%;width:26px;height:26px;padding:0;font-size:13px;color:var(--mute)}.tick:hover{background:var(--red);color:#fff;border:1px solid var(--red)}
.ch{color:var(--ink)}.ch b{color:var(--red);font-size:20px}.lh{color:var(--ink)}
.mi.on{background:#efefef;color:var(--ink)}.mi.on:hover{color:var(--ink)}#side{width:260px}.mi{gap:10px;padding:11px 10px}.mi span{white-space:nowrap}.mi em{padding:0 4px;font-size:9px}
.sb.on{background:#fff;border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}
.tgl{padding:5px 10px;font-size:12px;border:1px solid var(--line);background:#fff}.tgl.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.acc{border-top:1px solid var(--ink);margin-top:6px}.ah{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:#fff;padding:10px 6px;font-size:13px}.ah b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;min-width:84px}.ah span{flex:1;color:var(--mute)}.ah em{font-style:normal;color:var(--red);font-weight:700}.ah.cur b{color:var(--red)}.ah i{font-style:normal;color:var(--mute)}.ah.open{background:#f4f4f4}.ab{padding:4px 0 6px}.sl .cur{background:var(--ink);color:#fff}
.ex{font-size:11.5px;color:var(--mute);margin-top:2px}.empty{text-align:center;padding:48px 12px;color:var(--mute)}.empty b{display:block;font-size:18px;font-weight:300;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:60;max-width:92vw}#toast button{background:none;border:none;color:#fff;font-weight:700;text-decoration:underline;padding:0}#toast.hide{display:none}
.kh{font-size:11px}.note .m,.m{font-size:12.5px}
@media(max-width:820px){.ib{padding:6px 10px;font-size:18px}.tick{width:34px;height:34px;font-size:16px}.cn{font-size:15px}.pic,.stg{font-size:13px}#side{width:270px}}
.nt1 .cn{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}.acts{flex:none}#crumb{white-space:nowrap}.rl .cn{min-width:0;overflow-wrap:anywhere}

function gform(k,vals){const u=dutask();u.gen=u.gen||{};gpk=k;const v=vals||u.gen[k]||{},npn=+(v.npn||1);
 $('#gp').innerHTML=`<div class="gp"><div class="m">Fields start empty. The grey example shows what to type. ${dtask?'Values are saved in the selected task.':'No task selected: values are remembered on this device.'}</div><div class="g">${GF[k].filter(([f])=>{const m=/^(?:np|nc)([23])$/.exec(f);return !m||+m[1]<=npn}).map(([f,l,d,t,o,ex])=>{if(f=='_h')return`<h2 style="grid-column:1/-1;margin:10px 0 0">${l}</h2>`;
  const x=f=='no'?(vals?v.no:(dtask?u.no:v.no))??'':(v[f]??(typeof d=='function'?d(u):d)),rq=k=='prop'&&f=='no';
  let out=`<div class="${rq?'rq':''}"><label class="lb">${l}</label>${t=='sel'?`<select class="w" data-f="${f}"><option value="">Select…</option>${o.map(y=>`<option ${y==x?'selected':''}>${y}</option>`).join('')}</select>`:`<input class="w" data-f="${f}" type="${t||'text'}" value="${esc(x)}"${ex&&t!='date'?` placeholder="e.g. ${esc(ex)}"`:''}>`}${ex&&t=='date'?`<div class="ex">e.g. ${esc(ex)}</div>`:''}</div>`;
  if(f=='ctype'){const first=x.split(' ')[0],e=EU[first]||'EU_E1';out+=`<div class="m" style="grid-column:1/-1;margin:0 0 4px"><b>${e}</b> (system contract type): ${EUN[e]}${/^(Silver|SafeGuard)$/.test(first)?'':'<br><span style="color:var(--red)">Sections 1.2 Ruang Lingkup and 1.3 Pengecualian in the template are Silver wording (spare parts excluded). Edit them in Word before sending.</span>'}</div>`}
  return out}).join('')}</div><div class="bar" style="margin-top:8px"><button class="p" data-mk="${k}">Create ${k=='prop'?'Word file (.docx)':'Excel file (.xlsx)'}</button></div></div>`}
const fname=s=>String(s).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),safe=s=>String(s).replace(/[^\w-]+/g,'_');
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function docxBuild(u,v,type='blob'){const z=await JSZip.loadAsync(TPL.docx,{base64:true});let x=await z.file('word/document.xml').async('string');const D='@@DEL@@',d=v.date,no=v.no,np=+(v.npn||1),rpy=n=>rp(dnum(n))+' / tahun',PM={Yearly:'per tahun',Monthly:'per bulan',Quarterly:'per 3 bulan'},ah=v.ahead=='Ya',ar=v.ard=='Ya';
 const hr=[...x.matchAll(/<w:tr(?: [^>]*)?>(?:(?!<\/w:tr>)[\s\S])*?<\/w:tr>/g)].map(m=>m[0]).filter(s=>s.includes('w:highlight')),last=hr[hr.length-1];x=x.replace(last,()=>last+last);
 const nx=[];for(let i=1;i<=3;i++)nx.push(...(i<=np?[v.nu,v['np'+i],v.nv,rpy(v['nc'+i])]:[D,D,D,D]));
 const V=[v.cover,no||D,d.slice(8,10)+d.slice(5,7)+d.slice(2,4),tgl(d),v.to,(no?no+' – ':'')+v.cover,v.pu,v.pp,v.pv,rpy(v.pc),...nx,ah||ar?'Keterangan:':D,ah?'Schindler AHEAD / IoEE':D,ar?'Automatic Rescue Device (ARD) Battery':D,'dilakukan '+(PM[v.pay]||'___')+(v.padv=='Yes'?' di muka':''),v.val];let n=0;
 x=x.replace(/<w:r(?: [^>]*)?>(?:(?!<\/w:r>)[\s\S])*?<w:highlight[^>]*\/>(?:(?!<\/w:r>)[\s\S])*?<\/w:r>/g,r=>{const val=V[n++];let f=true;return r.replace(/<w:highlight[^>]*\/>/,'').replace(/<w:t(?: [^>]*)?>[^<]*<\/w:t>/g,()=>f?(f=false,`<w:t xml:space="preserve">${xe(val)}</w:t>`):'')});
 if(n!=V.length)throw new Error('Template changed: expected '+V.length+' highlighted fields, found '+n);
 const ct=/(<w:rPr>(?:(?!<\/w:rPr>)[\s\S])*?)(<\/w:rPr><w:t xml:space="preserve">)Silver Type Maintenance(<\/w:t>)/;if(!ct.test(x))throw new Error('Template changed: Contract Type heading not found');
 x=x.replace(ct,(m,a,b,c)=>`${a}<w:i/><w:iCs/>${b}${xe(v.ctype)}${c}`);
 x=x.replace(/<w:tr(?: [^>]*)?>(?:(?!<\/w:tr>)[\s\S])*?@@DEL@@[\s\S]*?<\/w:tr>/g,'').replace(/<w:p(?: [^>]*)?>(?:(?!<\/w:p>)[\s\S])*?@@DEL@@[\s\S]*?<\/w:p>/g,'');
 z.file('word/document.xml',x);return z.generateAsync({type,mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
const ser=s=>Math.round((new Date(s+'T00:00Z')-Date.UTC(1899,11,30))/864e5);
async function xlsxBuild(u,v,type='blob'){const z=await JSZip.loadAsync(TPL.xlsx,{base64:true});let x=await z.file('xl/worksheets/sheet1.xml').async('string');
 const set=(ref,val)=>{x=x.replace(new RegExp(`<c r="${ref}"([^>]*?)(?:/>|>[\\s\\S]*?</c>)`),(m,a)=>{const s=(a.match(/ s="\d+"/)||[''])[0],c=`<c r="${ref}"${s}`;
  if(val===''||val==null)return c+'/>';return typeof val=='number'?`${c}><v>${val}</v></c>`:`${c} t="inlineStr"><is><t xml:space="preserve">${xe(val)}</t></is></c>`})},N=k=>v[k]?dnum(v[k]):'',Dt=k=>v[k]?ser(v[k]):'';
 [['C4',v.cat],['C5',v.no],['C6',v.bn],['C7',v.eq],['C8',v.sd],['C12',v.pct],['C13',N('pp')],['C14',v.pbpm],['C16',N('pvis')],['G4',v.ioc=='-'?'':v.ioc],['G5',v.ah],['G12',v.ct],['G17',v.bpm],['G19',v.adv],['G20',N('vis')],['G21',v.pl],['G22',v.fr],['G23',v.so],['G24',v.cp],['G25',v.ph],['G26',v.em],['G27',v.nt],
 ['L4',v.stp],['L5',v.btp],['L12',N('fee')],['L13',N('ne')],['L18',v.cb],['L19',v.ibpm],['L21',v.iadv],['L22',v.c2p],['P4',Dt('ps')],['P5',Dt('pe')],['P6',Dt('ns')],['P7',N('dur')],['P11',N('q1')],['P12',N('q2')],['P13',N('q3')],['P14',N('q4')]].forEach(a=>set(...a));
 const nocache=s=>s.replace(/(<c [^>]*>)(<f[^>]*>[\s\S]*?<\/f>|<f[^>]*\/>)<v>[^<]*<\/v>/g,'$1$2');z.file('xl/worksheets/sheet1.xml',nocache(x));
 for(const f of ['xl/worksheets/sheet2.xml','xl/worksheets/sheet3.xml']){const e=z.file(f);if(e)z.file(f,nocache(await e.async('string')))}
 let w=await z.file('xl/workbook.xml').async('string');z.file('xl/workbook.xml',w.replace(/<calcPr([^>]*?)\/>/,'<calcPr$1 fullCalcOnLoad="1"/>'));
 return z.generateAsync({type,mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
document.addEventListener('change',e=>{if(e.target.id=='dtk'){dtask=e.target.value;gform(gpk)}
 if(['npn','ctype'].includes(e.target.dataset.f)){const v={};document.querySelectorAll('#gp [data-f]').forEach(x=>v[x.dataset.f]=x.value);gform(gpk,v)}});
document.addEventListener('click',async e=>{const t=e.target; if(t.dataset.mk){const k=t.dataset.mk,v={};document.querySelectorAll('#gp [data-f]').forEach(x=>v[x.dataset.f]=x.value.trim());
  if(k=='prop'&&!v.no){document.querySelector('#gp .rq input').classList.add('bad');alert('Nomor Kontrak is needed for the proposal.');return}
  const em=emptyFields(k,v);if(em.length&&!confirm('These fields are empty:\n- '+em.join('\n- ')+'\n\nCreate the file anyway?'))return;
  const tk=D.find(x=>x.id==dtask);if(tk){tk.gen=tk.gen||{};tk.gen[k]=v;tk.no=v.no||'';tk.upd=Date.now();save()}else{FREE[k]=v;try{localStorage.setItem('ei_free_v1',JSON.stringify(FREE))}catch(_){}}
  const cn=tk?tk.customer:(k=='prop'?v.cover:v.bn)||'Customer',u2=tk||{customer:cn,pic:'',no:v.no||'',gen:FREE};
  try{if(k=='prop')dl(await docxBuild(u2,v),'Proposal Schindler Service Contract - '+fname(cn)+'.docx');else dl(await xlsxBuild(u2,v),'SAP_Form_'+safe(cn)+'.xlsx')}catch(err){alert('Could not create the file: '+err.message)}}});
const SIDEK='ei_side_v1',mob=()=>innerWidth<=820;
try{if(localStorage.getItem(SIDEK)=='c')document.body.classList.add('sc')}catch(e){}
$('#tg').onclick=()=>{if(mob())document.body.classList.toggle('so');else{const c=document.body.classList.toggle('sc');try{localStorage.setItem(SIDEK,c?'c':'o')}catch(_){}}};
$('#ov').onclick=()=>document.body.classList.remove('so');
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)||$('#dlg').open)return;const k=e.key.toLowerCase(),go=v=>{view=v;render();window.scrollTo(0,0)};
 if(k=='n'){e.preventDefault();if(view!='tasks')go('tasks');$('#add').click()}else if(k=='p'){e.preventDefault();go('prop')}else if(k=='s'){e.preventDefault();go('sap')}else if(k=='c'){e.preventDefault();go('contract')}
 else if(k=='k'){e.preventDefault();if(view!='tasks'||sf!='all'){view='tasks';sf='all';render()}$('#q').focus()}});
load();render();
